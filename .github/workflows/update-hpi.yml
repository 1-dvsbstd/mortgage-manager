name: Refresh official UK HPI bundle

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 17-24 * *'
  push:
    paths:
      - '.github/workflows/update-hpi.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and normalise latest official UK HPI property-type data
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import urllib.request
          from datetime import date, datetime, timezone

          BASE = 'https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data/Average-prices-Property-Type-{month}.csv'

          def shift_month(year, month, delta):
              n = year * 12 + (month - 1) + delta
              return n // 12, n % 12 + 1

          def parse_month(value):
              value = str(value or '').strip()
              for fmt in ('%d/%m/%Y', '%Y-%m-%d', '%Y-%m'):
                  try:
                      return datetime.strptime(value[:10], fmt).strftime('%Y-%m')
                  except Exception:
                      pass
              return ''

          today = date.today()
          candidates = []
          for delta in range(-2, -10, -1):
              y, m = shift_month(today.year, today.month, delta)
              candidates.append(f'{y:04d}-{m:02d}')

          raw = None
          release_month = ''
          for month in candidates:
              url = BASE.format(month=month)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mortgage-Manager-HPI-Updater/1.0'})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read().decode('utf-8-sig')
                  release_month = month
                  print(f'Using official UK HPI property-type file: {month}')
                  break
              except Exception as exc:
                  print(f'{month}: unavailable ({exc})')

          if not raw:
              raise SystemExit('No official HPI property-type file could be downloaded.')

          rows = list(csv.reader(io.StringIO(raw)))
          if rows and rows[0] and str(rows[0][0]).strip().lower() == 'date':
              rows = rows[1:]

          cutoff_y, cutoff_m = shift_month(today.year, today.month, -26)
          cutoff = f'{cutoff_y:04d}-{cutoff_m:02d}'
          areas = {}
          observed_months = set()

          for row in rows:
              if len(row) < 16:
                  continue
              month = parse_month(row[0])
              if not month or month < cutoff:
                  continue

              region = str(row[1]).strip()
              code = str(row[2]).strip().upper()
              if not region or not code:
                  continue

              def num(value):
                  try:
                      value = str(value).strip().replace(',', '')
                      return round(float(value), 2) if value else None
                  except Exception:
                      return None

              # Property-type file column groups are:
              # Detached price/index/1m/12m, Semi-detached price/index/1m/12m,
              # Terraced price/index/1m/12m, Flat price/index/1m/12m.
              prices = {
                  'detached': num(row[3]),
                  'semiDetached': num(row[7]),
                  'terraced': num(row[11]),
                  'flat': num(row[15]),
              }
              if not any(v and v > 0 for v in prices.values()):
                  continue

              area = areas.setdefault(code, {'name': region, 'months': {}})
              area['months'][month] = prices
              observed_months.add(month)

          if not areas or not observed_months:
              raise SystemExit('Downloaded HPI file did not contain usable recent property-type data.')

          for area in areas.values():
              available = sorted(area['months'])
              area['latestMonth'] = available[-1] if available else ''

          observed_months = sorted(observed_months)
          payload = {
              'schema': 1,
              'source': 'HM Land Registry UK House Price Index',
              'sourceUrl': 'https://www.gov.uk/government/collections/uk-house-price-index-reports',
              'licence': 'UK Open Government Licence v3.0',
              'releaseMonth': release_month,
              'latestMonth': observed_months[-1],
              'months': observed_months,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'areas': areas,
          }

          for path in ['public/hpi-local-property-type.json', 'preview/public/hpi-local-property-type.json']:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as handle:
                  json.dump(payload, handle, separators=(',', ':'), ensure_ascii=False)
                  handle.write('\n')
              print(f'wrote {path} ({len(areas)} geographies, latest {observed_months[-1]})')
          PY

      - name: Commit updated HPI bundle
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/hpi-local-property-type.json preview/public/hpi-local-property-type.json)" ]; then
            echo "Official HPI bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hpi-local-property-type.json preview/public/hpi-local-property-type.json
          git commit -m "Refresh bundled official UK HPI data"
          git push
