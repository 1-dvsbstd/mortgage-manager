<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Warm editorial illustration of a home in the countryside</title>
  <desc id="desc">A clean stylised cream home with a dark roof, soft hills and trees in a warm neutral palette.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe4d4"/>
      <stop offset="1" stop-color="#f7f1e9"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9a8d"/>
      <stop offset="1" stop-color="#c2c6b7"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8b49c"/>
      <stop offset="1" stop-color="#d9cdb6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#283039" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#sky)"/>
